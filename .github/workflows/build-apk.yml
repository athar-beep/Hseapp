name: Build Android APK (debug)

# Builds an installable debug APK of the HSE FieldReady app (Capacitor).
# Runs on demand, and automatically when app code changes on the upgrade branch.
on:
  workflow_dispatch:
  push:
    branches: [upgrade/phase-1-auth-security-hse-logic]
    paths:
      - 'src/**'
      - 'index.html'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'
      - 'capacitor.config.ts'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up JDK 21 (Capacitor 8 / Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install

      - name: Build web app (Supabase public config is baked in at build time)
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Sync web app into the Android project
        run: bun x cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hse-fieldready-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
